[workspace]
resolver = "3"
members = [
  "crates/mbx",
  "crates/mbx-cache-cc",
  "crates/mbx-cache-core",
  "crates/mbx-cache-cargo",
  "crates/mbx-cache-protocol",
  "crates/mbx-cache-rustc",
  "crates/mbx-cache-store",
]

[workspace.package]
# `version` is deliberately absent: the crates here do not share one number.
# What each crate's version promises differs, so each carries its own. See the
# version tiers in release-plz.toml.
edition = "2024"
rust-version = "1.91"
license = "MIT"
homepage = "https://github.com/jdx/mr-boxington"
repository = "https://github.com/jdx/mr-boxington"
# Every crate ships the workspace README, so a crates.io page describes the
# whole tool rather than repeating a paragraph per crate.
readme = "README.md"

[profile.release]
# mbx pulls cache, transport, TLS, and TUI code into one binary. Whole-program
# optimization removes enough otherwise-retained code and relocations to make
# every invocation cheaper, including the rustc shim and CLI startup paths.
lto = "fat"
codegen-units = 1
# A panic is already fatal at every CLI and shim boundary. Omitting unwind
# tables keeps the frequently-started binary smaller without changing recovery.
panic = "abort"
strip = "symbols"
