[workspace]
resolver = "3"
members = [
  "crates/mbx",
  "crates/mbx-cache-core",
  "crates/mbx-cache-protocol",
  "crates/mbx-cache-rustc",
]

[workspace.package]
# One version for every crate in the workspace. release-plz keeps them in step
# through the `version_group` in release-plz.toml, so a release moves all four
# together rather than leaving each on a number of its own.
version = "0.4.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
homepage = "https://github.com/jdx/mr-boxington"
repository = "https://github.com/jdx/mr-boxington"

[profile.release]
lto = "thin"
strip = "symbols"
