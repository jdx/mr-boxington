name: advisories

# CI runs `cargo deny check advisories` only on pushes to main and on pull
# requests that change Cargo.lock, Cargo.toml, or deny.toml, so a newly
# published RustSec advisory cannot turn unrelated PRs red. This run is the
# standing watch for that case: it checks main daily, files or updates one
# tracking issue, and emails, rather than only turning a run red where nobody
# is looking.
on:
  workflow_dispatch:
  schedule:
    # Daily, away from the top of the hour and clear of the weekly canary in
    # measure.yml.
    - cron: "37 7 * * *"

concurrency:
  group: advisories
  cancel-in-progress: false

permissions: {}

jobs:
  advisories:
    if: ${{ github.repository == 'jdx/mr-boxington' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny

      # Advisories only. Licenses, bans, and sources are policy over the
      # manifests, so they cannot change without a commit and CI already gates
      # them; the advisory database changes on its own. --all-features matches
      # cargo-deny-action's default, so CI and this run audit the same graph.
      - name: Check advisories
        id: deny
        run: |
          set +e
          rm -rf ~/.cargo/advisory-dbs
          cargo deny --all-features check advisories > "$RUNNER_TEMP/deny.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/deny.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update tracking issue
        if: steps.deny.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="cargo-deny: new security advisories"
          # Cap the output so the body stays under GitHub's size limit.
          {
            echo "\`cargo deny check advisories\` failed on \`main\` ([run]($RUN_URL))."
            echo
            echo "Fix by updating the affected crate, or ignore the advisory in \`deny.toml\` with a reason."
            echo
            echo '```'
            head -c 50000 "$RUNNER_TEMP/deny.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Send failure email via Resend
        if: ${{ !cancelled() && steps.deny.outputs.status != '0' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A missing secret must not masquerade as a clean audit, but it must
          # not hide the advisory either: warn, and let the failing step below
          # still turn the run red.
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${NOTIFY_EMAIL:-}" ]; then
            echo "::warning::RESEND_API_KEY or NOTIFY_EMAIL is unset; skipping notification"
            exit 0
          fi
          # jq builds the payload so an advisory title can never break the JSON.
          payload=$(jq -n \
            --arg to "$NOTIFY_EMAIL" \
            --arg run_url "$RUN_URL" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              from: "mise CI <mise@en.dev>",
              to: [$to],
              subject: "❌ \($repo): cargo-deny found new security advisories",
              html: (
                "<p><strong>cargo deny check advisories</strong> failed on main in \($repo | @html).</p>"
                + "<p><a href=\"\($run_url | @html)\">View workflow run</a> | <a href=\"https://github.com/\($repo)/issues\">Tracking issue</a></p>"
              )
            }')
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$payload"

      - name: Fail run
        if: ${{ !cancelled() && steps.deny.outputs.status != '0' }}
        run: exit 1
