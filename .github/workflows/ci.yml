name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Build documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise run check:docs
          mise run build:docs

  lint:
    runs-on: namespace-profile-endev-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - name: Bootstrap mbx
        run: |
          cargo build --package mbx --target-dir target/mbx-bootstrap-build
          mkdir -p target/mbx-bootstrap
          cp target/mbx-bootstrap-build/debug/mbx target/mbx-bootstrap/mbx
      - run: ./target/mbx-bootstrap/mbx fmt --all --check
      - run: ./target/mbx-bootstrap/mbx clippy --workspace --all-features --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: namespace-profile-endev-linux-amd64
          - os: macos-latest
            runner: namespace-profile-endev-macos-arm64
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - if: matrix.os != 'windows-latest'
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - if: matrix.os == 'windows-latest'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup target add wasm32-unknown-unknown
      - name: Bootstrap mbx
        shell: bash
        run: |
          cargo build --package mbx --target-dir target/mbx-bootstrap-build
          mkdir -p target/mbx-bootstrap
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/mbx-bootstrap-build/debug/mbx.exe target/mbx-bootstrap/mbx.exe
          else
            cp target/mbx-bootstrap-build/debug/mbx target/mbx-bootstrap/mbx
          fi
      - run: ./target/mbx-bootstrap/mbx${{ runner.os == 'Windows' && '.exe' || '' }} build --workspace --all-targets
      - run: ./target/mbx-bootstrap/mbx${{ runner.os == 'Windows' && '.exe' || '' }} test --workspace
      - name: Run Bats behavioral tests
        if: runner.os != 'Windows'
        env:
          MBX_BIN: ${{ github.workspace }}/target/mbx-bootstrap/mbx
        run: test/bats/bin/bats test
      - name: Windows end-to-end tests
        if: runner.os == 'Windows'
        run: pwsh e2e-win/run.ps1

  compatibility:
    runs-on: namespace-profile-endev-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # master
        with:
          toolchain: "1.91"
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - name: Check MSRV
        run: cargo check --locked --workspace --all-targets
      - name: Check without a TLS backend
        run: cargo check --locked --workspace --all-targets --no-default-features
      - name: Check native TLS
        run: cargo check --locked --workspace --all-targets --no-default-features --features native-tls
      - name: Check rustls with native roots
        run: cargo check --locked --workspace --all-targets --no-default-features --features rustls-native-roots

  supply-chain:
    runs-on: namespace-profile-endev-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  public-api:
    name: public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Find packages present in both revisions
        id: semver-packages
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          # The CLI crate's library target exists so the binary and its
          # integration tests can share application code; it is not an API
          # anything outside this workspace is meant to build against, which
          # `crates/mbx/src/lib.rs` says outright. Checking it would mean a
          # major bump every time the CLI gains a setting, or contorting
          # internal types to avoid one. The published API lives in
          # mbx-cache-core and mbx-cache-rustc, which stay checked.
          UNCHECKED_PACKAGES: mbx
        run: |
          baseline_dir="$(mktemp -d)"
          git worktree add --detach "$baseline_dir" "origin/$BASE_REF"
          packages="$({
            comm -12 \
              <(cargo metadata --no-deps --format-version 1 | jq -r '.workspace_members as $members | [.packages[] | select(.id as $id | $members | index($id)) | .name] | sort | .[]') \
              <(cargo metadata --manifest-path "$baseline_dir/Cargo.toml" --no-deps --format-version 1 | jq -r '.workspace_members as $members | [.packages[] | select(.id as $id | $members | index($id)) | .name] | sort | .[]')
          } | { grep -vxF "$UNCHECKED_PACKAGES" || true; } | paste -sd, -)"
          # An empty list would make the action check every package rather than
          # nothing, so say what happened instead. `|| true` above keeps grep's
          # no-match exit out of pipefail's way so this message is reachable.
          if [ -z "$packages" ]; then
            echo "no shared packages left to check" >&2
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Check workspace API against the PR base
        if: github.event_name == 'pull_request'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: origin/${{ github.base_ref }}
          feature-group: all-features
          package: ${{ steps.semver-packages.outputs.packages }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-08-02 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-08-02 install cargo-fuzz --version 0.13.2 --locked
      - name: Compile fuzz targets
        run: cargo +nightly-2026-08-02 fuzz build
      - name: Smoke-test fuzz targets
        run: |
          cargo +nightly-2026-08-02 fuzz run blob_pack -- -runs=1000
          cargo +nightly-2026-08-02 fuzz run dep_info -- -runs=1000
          cargo +nightly-2026-08-02 fuzz run rustc_paths -- -runs=1000

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Valgrind
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Build benchmark driver
        run: mise run perf:prepare
      - name: Measure instruction counts
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/mbx-measurements/tak"
          tak run --record
          tak history | tee "$RUNNER_TEMP/mbx-measurements/tak/history.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare instruction counts with the PR base
        id: tak_compare
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/notes/tak >/dev/null 2>&1; then
            tak compare "origin/${GITHUB_BASE_REF}" \
              | tee "$RUNNER_TEMP/mbx-measurements/tak/comparison.md" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No shared tak history yet; this PR will seed it after merge." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage benchmark driver
        run: cp target/release/mbx "$RUNNER_TEMP/mbx-benchmark-driver"
      - name: Measure cold and warm workspace builds
        run: |
          python3 benchmarks/measure_builds.py \
            --mbx "$RUNNER_TEMP/mbx-benchmark-driver" \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/mbx-measurements/build"
      - name: Publish job summary
        if: always()
        run: |
          find "$RUNNER_TEMP/mbx-measurements" -name '*.md' -type f -print0 \
            | sort -z \
            | xargs -0 -r cat >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mbx-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mbx-measurements
          if-no-files-found: error
          retention-days: 90
      - name: Enforce instruction-count regression gate
        if: steps.tak_compare.outcome == 'failure'
        run: exit 1

  final:
    permissions: {}
    needs:
      - compatibility
      - docs
      - fuzz
      - lint
      - supply-chain
      - public-api
      - performance
      - test
    runs-on: namespace-profile-endev-linux-amd64
    timeout-minutes: 1
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override `cancel-in-progress` and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Check job results
        if: |
          needs.docs.result != 'success' ||
          needs.fuzz.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.compatibility.result != 'success' ||
          needs.supply-chain.result != 'success' ||
          needs.public-api.result != 'success' ||
          needs.performance.result != 'success' ||
          needs.test.result != 'success'
        run: exit 1
      - run: echo "All CI jobs completed successfully"
