name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Build documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise run check:docs
          mise run check:links

  lint:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - name: Bootstrap mbx
        run: |
          cargo build --package mbx --target-dir target/mbx-bootstrap-build
          mkdir -p target/mbx-bootstrap
          cp target/mbx-bootstrap-build/debug/mbx target/mbx-bootstrap/mbx
      - run: ./target/mbx-bootstrap/mbx fmt --all --check
      - run: ./target/mbx-bootstrap/mbx clippy --workspace --all-features --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: namespace-profile-endev-linux-amd64;overrides.cache-tag=cache
          - os: macos-latest
            runner: namespace-profile-endev-macos-arm64;overrides.cache-tag=cache
          - os: windows-latest
            runner: windows-latest
          # Every Linux binary a release ships is musl, and every job above
          # builds gnu, so without these the shipped configuration would reach
          # users having only ever run `--version`. File locks, unix sockets,
          # and the reflink ioctls are where a musl-only divergence would hide.
          # Both release architectures have a native runner, so a static musl
          # binary needs no emulation to build or run its own test suite.
          - os: ubuntu-latest
            runner: namespace-profile-endev-linux-amd64;overrides.cache-tag=cache
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            runner: namespace-profile-endev-linux-arm64;overrides.cache-tag=cache
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      # Empty for the host-target jobs, which pass no `--target` at all and
      # keep cargo's default directory layout.
      TARGET: ${{ matrix.target }}
      # rustls brings in aws-lc-sys, which compiles C: cc-rs looks for a
      # target-prefixed compiler, and Debian's musl-tools only ships
      # `musl-gcc`. Naming it for both musl targets is harmless elsewhere,
      # since nothing else consults these variables.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - if: runner.os != 'Windows'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - if: matrix.os != 'windows-latest'
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - if: matrix.os == 'windows-latest'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: rustup target add wasm32-unknown-unknown ${{ matrix.target }}
      - name: Bootstrap mbx
        shell: bash
        run: |
          target_flags=()
          [[ -n "$TARGET" ]] && target_flags+=(--target "$TARGET")
          cargo build --package mbx --target-dir target/mbx-bootstrap-build "${target_flags[@]}"
          # A `--target` build nests its artifacts one level deeper.
          build_dir="target/mbx-bootstrap-build${TARGET:+/$TARGET}/debug"
          mkdir -p target/mbx-bootstrap
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$build_dir/mbx.exe" target/mbx-bootstrap/mbx.exe
          else
            cp "$build_dir/mbx" target/mbx-bootstrap/mbx
          fi
      - shell: bash
        run: |
          target_flags=()
          [[ -n "$TARGET" ]] && target_flags+=(--target "$TARGET")
          ./target/mbx-bootstrap/mbx${{ runner.os == 'Windows' && '.exe' || '' }} build --workspace --all-targets "${target_flags[@]}"
      - shell: bash
        run: |
          target_flags=()
          [[ -n "$TARGET" ]] && target_flags+=(--target "$TARGET")
          ./target/mbx-bootstrap/mbx${{ runner.os == 'Windows' && '.exe' || '' }} test --workspace "${target_flags[@]}"
      - name: Run Bats behavioral tests
        if: runner.os != 'Windows'
        env:
          MBX_BIN: ${{ github.workspace }}/target/mbx-bootstrap/mbx
        run: test/bats/bin/bats test
      - name: Windows end-to-end tests
        if: runner.os == 'Windows'
        run: pwsh e2e-win/run.ps1

  compatibility:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=cache
    env:
      RUSTUP_TOOLCHAIN: "1.91"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - name: Check MSRV
        run: cargo check --locked --workspace --all-targets
      - name: Check without a TLS backend
        run: cargo check --locked --workspace --all-targets --no-default-features
      - name: Check native TLS
        run: cargo check --locked --workspace --all-targets --no-default-features --features native-tls
      - name: Check rustls with native roots
        run: cargo check --locked --workspace --all-targets --no-default-features --features rustls-native-roots

  supply-chain:
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-08-02 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-08-02 install cargo-fuzz --version 0.13.2 --locked
      - name: Compile fuzz targets
        run: cargo +nightly-2026-08-02 fuzz build
      - name: Smoke-test fuzz targets
        run: |
          cargo +nightly-2026-08-02 fuzz run blob_pack -- -runs=1000
          cargo +nightly-2026-08-02 fuzz run cc_depfile -- -runs=1000
          cargo +nightly-2026-08-02 fuzz run cc_invocation -- -runs=1000
          cargo +nightly-2026-08-02 fuzz run dep_info -- -runs=1000
          cargo +nightly-2026-08-02 fuzz run rustc_paths -- -runs=1000

  final:
    permissions: {}
    needs:
      - compatibility
      - docs
      - fuzz
      - lint
      - supply-chain
      - public-api
      - test
    runs-on: namespace-profile-endev-linux-amd64;overrides.cache-tag=cache
    timeout-minutes: 1
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override `cancel-in-progress` and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Check job results
        if: |
          needs.docs.result != 'success' ||
          needs.fuzz.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.compatibility.result != 'success' ||
          needs.supply-chain.result != 'success' ||
          needs.public-api.result != 'success' ||
          needs.test.result != 'success'
        run: exit 1
      - run: echo "All CI jobs completed successfully"
