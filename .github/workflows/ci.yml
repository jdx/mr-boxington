name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: namespace-profile-endev-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: namespace-profile-endev-linux-amd64
          - os: macos-latest
            runner: namespace-profile-endev-macos-arm64
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.os != 'windows-latest'
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - if: matrix.os == 'windows-latest'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  compatibility:
    runs-on: namespace-profile-endev-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # master
        with:
          toolchain: "1.91"
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust
      - name: Check MSRV
        run: cargo check --locked --workspace --all-targets
      - name: Check without a TLS backend
        run: cargo check --locked --workspace --all-targets --no-default-features
      - name: Check native TLS
        run: cargo check --locked --workspace --all-targets --no-default-features --features native-tls
      - name: Check rustls with native roots
        run: cargo check --locked --workspace --all-targets --no-default-features --features rustls-native-roots

  supply-chain:
    runs-on: namespace-profile-endev-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check

  public-api:
    name: public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check workspace API against the PR base
        if: github.event_name == 'pull_request'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: origin/${{ github.base_ref }}
          feature-group: all-features

  final:
    permissions: {}
    needs:
      - compatibility
      - lint
      - supply-chain
      - public-api
      - test
    runs-on: namespace-profile-endev-linux-amd64
    timeout-minutes: 1
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override `cancel-in-progress` and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Check job results
        if: |
          needs.lint.result != 'success' ||
          needs.compatibility.result != 'success' ||
          needs.supply-chain.result != 'success' ||
          needs.public-api.result != 'success' ||
          needs.test.result != 'success'
        run: exit 1
      - run: echo "All CI jobs completed successfully"
