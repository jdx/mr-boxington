name: bench-refresh

on:
  schedule:
    # Weekly, away from the top of the hour. A real-world benchmark is an hour
    # of runner time per pass; nightly would buy churn rather than signal.
    - cron: "41 4 * * 2"
  workflow_dispatch:
    inputs:
      force:
        description: Rerun the benchmark even when mbx's version has not changed
        required: false
        type: boolean
        default: false
      small_edit_cache_run_id:
        description: Reuse small-edit parent caches from this workflow run ID
        required: false
        type: string
        default: ""
      small_edit_mbx_version:
        description: mbx release to use for the small-edit comparison
        required: false
        type: string
        default: "1.7.0"

permissions: {}

# Two refreshes would race the force-push to the shared `bench-refresh`
# branch. A manual dispatch supersedes an in-flight scheduled run.
concurrency:
  group: bench-refresh
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Rust 1.97.1 is part of the digest-pinned benchmark image.
  MISE_DISABLE_TOOLS: rust
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  # Only benchmark when the mbx that produced the published numbers is older
  # than the latest release. A docs or chore push does not invalidate a timing,
  # and benchmarking an unreleased checkout would publish numbers users cannot
  # reproduce with the version they can install.
  check:
    name: Check version drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      release: ${{ steps.drift.outputs.release }}
      bench: ${{ steps.drift.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare latest release against published benchmark
        id: drift
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh release view --json tagName --jq '.tagName | ltrimstr("v")')
          # Absent until the first refresh lands, which is itself drift.
          BENCH=$(jq -r '.versions.mbx // empty' benchmarks/results.json 2>/dev/null || true)
          if [ -z "$RELEASE" ]; then
            echo "::error::Could not resolve the latest mbx release"
            exit 1
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "bench=$BENCH" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_REFRESH" = "true" ] || [ "$BENCH" != "$RELEASE" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    name: Refresh benchmarks
    needs: check
    if: needs.check.outputs.drift == 'true' && github.ref != 'refs/heads/codex/benchmark-small-edit'
    # Keep the runner class fixed: the six-job contention scenario needs enough
    # CPU to reproduce the large parallel CI job it models, and timings cannot
    # be compared across machine classes. The host-wide lease serializes this
    # with every other jdx performance job.
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    # The full refresh also runs every cache scenario and the toolchain guard.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
        env:
          MISE_LOCKED: "1"
      # The comparison should track kache itself, not the version that happened
      # to be current when mise.lock was last updated. Install the newest stable
      # release explicitly, then keep its real path for builds that run outside
      # this repository (where a mise shim cannot resolve this configuration).
      - name: Install latest benchmark comparator
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_LOCKED: "0"
        run: |
          mise install github:kunobi-ninja/kache@latest
          echo "KACHE_INSTALL_DIR=$(mise where github:kunobi-ninja/kache@latest)" \
            >> "$GITHUB_ENV"
      - name: Runner metadata
        run: |
          {
            echo '### Runner metadata'
            echo '```text'
            echo 'environment-revision: perf-runner@fd66d9b'
            echo 'image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68'
            uname -a
            lscpu
            mise --version
            rustc --version
            cargo --version
            valgrind --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install released mbx
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: v${{ needs.check.outputs.release }}
        run: |
          archive=mbx-x86_64-unknown-linux-gnu.tar.gz
          install_dir="$RUNNER_TEMP/mbx-release"
          mkdir -p "$install_dir"
          gh release download "$RELEASE" \
            --pattern "$archive" \
            --pattern SHA256SUMS \
            --dir "$install_dir"
          grep "  $archive$" "$install_dir/SHA256SUMS" \
            | (cd "$install_dir" && sha256sum --check --strict -)
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          echo "MBX_BENCH_BINARY=$install_dir/mbx" >> "$GITHUB_ENV"
      # Clippy for 1.97.1 and the alternate 1.96.0 toolchain are part of the
      # pinned image, so this job never needs static.rust-lang.org at runtime.
      - name: Refresh benchmarks
        env:
          MBX_BENCH_ALTERNATE_TOOLCHAIN: 1.96.0
          MISE_LOCKED: "1"
        run: |
          PATH="$KACHE_INSTALL_DIR:$PATH" \
            python3 benchmarks/real_world.py \
            --mbx "$MBX_BENCH_BINARY" \
            --scenarios cold,warm,commit,worktree,toolchain,contention \
            --output target/benchmarks \
            --write-results benchmarks/results.json
      - name: Publish job summary
        if: always()
        # A run that failed before writing its summary has already reported
        # why; a missing file here would only add a second, less informative
        # red step on top of it.
        run: |
          if [ -f target/benchmarks/real-world.md ]; then
            cat target/benchmarks/real-world.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The benchmark did not get as far as writing a summary." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mbx-real-world-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmarks
          if-no-files-found: error
          retention-days: 90
      - name: Upload refreshed results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-json-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/results.json
          if-no-files-found: error

  # Opening the pull request is a separate job so the benchmark itself never
  # holds write permission, and so a benchmark whose numbers are invalid can
  # never reach the site.
  propose:
    name: Propose the refreshed numbers
    needs: [check, refresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: results-json-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/refreshed
      - name: Stage the refreshed results
        run: cp "$RUNNER_TEMP/refreshed/results.json" benchmarks/results.json
      - name: Check for a diff
        id: dirty
        run: |
          if git diff --quiet -- benchmarks/results.json \
            && [ -z "$(git status --porcelain -- benchmarks/results.json)" ]; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi
      # One reused branch, always force-pushed: the previous numbers are
      # superseded by these, never added to. Reusing it preserves the PR.
      - name: Force-push the bench-refresh branch
        if: steps.dirty.outputs.dirty == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bench-refresh
          git add benchmarks/results.json
          git commit -m "chore: refresh real-world benchmarks"
          # persist-credentials: false means the push has to authenticate
          # explicitly. Re-point origin rather than pushing to a one-shot URL,
          # so --force-with-lease has a remote-tracking ref to compare with.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin bench-refresh || true
          git push --force-with-lease -u origin HEAD:refs/heads/bench-refresh
      - name: Create or update the pull request
        if: steps.dirty.outputs.dirty == 'true'
        env:
          # The same credential release-plz uses to open its pull requests.
          # The default token cannot: this repository does not let Actions
          # create them, and one it opened would not start CI anyway.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE: ${{ needs.check.outputs.release }}
          BENCH: ${{ needs.check.outputs.bench }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/body.md" <<EOF
          ## Refreshed real-world benchmarks

          \`benchmarks/results.json\` was measured with \`${BENCH:-no previous run}\`; the latest release is now \`mbx ${RELEASE}\`. Re-ran the benchmark with that release on the dedicated performance runner: a pinned checkout of jdx/hk built under raw cargo, mbx, and kache across the cold, warm, next-commit, cross-worktree, toolchain-change, and six-job contention scenarios.

          The [run summary](${RUN_URL}) has the table these numbers came from, and the run's artifacts have the per-build logs.

          **Read the numbers before merging.** They publish to https://mr-boxington.jdx.dev/benchmarks on merge. A scenario that swapped places is worth investigating before it goes on the site.

          ---
          Generated by the \`bench-refresh\` workflow.
          EOF
          EXISTING=$(gh pr list --state open --head bench-refresh --json number --jq '.[0].number // empty')
          TITLE="chore: refresh real-world benchmarks for mbx v${RELEASE}"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head bench-refresh \
              --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  edit-rust-cache-seed:
    name: Seed rust-cache at the parent
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/benchmark-small-edit' &&
      inputs.small_edit_cache_run_id == ''
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/hk
          ref: 27bb615768b85c9ac88e2abf8895219b44462871
          path: subject
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          shared-key: hk-small-edit-${{ github.run_id }}
          add-job-id-key: "false"
          workspaces: subject -> target
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - working-directory: subject
        run: cargo build --locked

  edit-rust-cache-measure:
    name: Measure rust-cache after the edit
    needs: edit-rust-cache-seed
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/benchmark-small-edit' &&
      (needs.edit-rust-cache-seed.result == 'success' || inputs.small_edit_cache_run_id != '')
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/hk
          ref: fc29ead1456ba7c1f62826c284126410a4014b00
          path: subject
          persist-credentials: false
      - name: Start end-to-end timer
        run: echo "EDIT_STARTED_NS=$(date +%s%N)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          shared-key: hk-small-edit-${{ inputs.small_edit_cache_run_id || github.run_id }}
          add-job-id-key: "false"
          workspaces: subject -> target
          save-if: "false"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - id: measure
        working-directory: subject
        run: |
          started=$(date +%s%N)
          cargo build --locked
          finished=$(date +%s%N)
          echo "build_duration_ns=$((finished - started))" >> "$GITHUB_OUTPUT"
          echo "total_duration_ns=$((finished - EDIT_STARTED_NS))" >> "$GITHUB_OUTPUT"
      - name: Record result
        env:
          BUILD_DURATION_NS: ${{ steps.measure.outputs.build_duration_ns }}
          TOTAL_DURATION_NS: ${{ steps.measure.outputs.total_duration_ns }}
        run: |
          mkdir -p target/small-edit
          jq -n --arg tool rust-cache \
            --argjson build_duration_ns "$BUILD_DURATION_NS" \
            --argjson restore_and_build_duration_ns "$TOTAL_DURATION_NS" \
            '{tool:$tool, build_duration_ns:$build_duration_ns, restore_and_build_duration_ns:$restore_and_build_duration_ns}' \
            > target/small-edit/rust-cache.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: small-edit-rust-cache-${{ github.run_id }}
          path: target/small-edit/rust-cache.json

  edit-mbx-seed:
    name: Seed mbx at the parent
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/benchmark-small-edit' &&
      inputs.small_edit_cache_run_id == ''
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/hk
          ref: 27bb615768b85c9ac88e2abf8895219b44462871
          path: subject
          persist-credentials: false
      - uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1
        with:
          version: ${{ inputs.small_edit_mbx_version || '1.7.0' }}
          cache-key: hk-small-edit-mbx-${{ github.run_id }}-parent
          save-on-workflow-dispatch: "true"
          toolchain: 1.97.1
      - working-directory: subject
        run: mbx build --locked

  edit-mbx-measure:
    name: Measure mbx after the edit
    needs: edit-mbx-seed
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/benchmark-small-edit' &&
      (needs.edit-mbx-seed.result == 'success' || inputs.small_edit_cache_run_id != '')
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/hk
          ref: fc29ead1456ba7c1f62826c284126410a4014b00
          path: subject
          persist-credentials: false
      - name: Start end-to-end timer
        run: echo "EDIT_STARTED_NS=$(date +%s%N)" >> "$GITHUB_ENV"
      - uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1
        with:
          version: ${{ inputs.small_edit_mbx_version || '1.7.0' }}
          cache-key: hk-small-edit-mbx-${{ github.run_id }}-child
          restore-keys: hk-small-edit-mbx-${{ inputs.small_edit_cache_run_id || github.run_id }}-parent
          toolchain: 1.97.1
      - id: measure
        working-directory: subject
        run: |
          started=$(date +%s%N)
          mbx build --locked
          finished=$(date +%s%N)
          echo "build_duration_ns=$((finished - started))" >> "$GITHUB_OUTPUT"
          echo "total_duration_ns=$((finished - EDIT_STARTED_NS))" >> "$GITHUB_OUTPUT"
      - name: Record result
        env:
          BUILD_DURATION_NS: ${{ steps.measure.outputs.build_duration_ns }}
          TOTAL_DURATION_NS: ${{ steps.measure.outputs.total_duration_ns }}
        run: |
          mkdir -p target/small-edit
          jq -n --arg tool mbx \
            --arg version "${{ inputs.small_edit_mbx_version || '1.7.0' }}" \
            --argjson build_duration_ns "$BUILD_DURATION_NS" \
            --argjson restore_and_build_duration_ns "$TOTAL_DURATION_NS" \
            '{tool:$tool, version:$version, build_duration_ns:$build_duration_ns, restore_and_build_duration_ns:$restore_and_build_duration_ns}' \
            > target/small-edit/mbx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: small-edit-mbx-${{ github.run_id }}
          path: target/small-edit/mbx.json

  edit-mbx-direct-seed:
    name: Seed direct hydrated mbx at the parent
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/benchmark-small-edit' &&
      inputs.small_edit_cache_run_id == ''
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    env:
      MBX_DIRECT_ROOT: /github/home/mbx-direct
      MBX_CACHE_DIR: /github/home/mbx-direct/store
      CARGO_HOME: /github/home/mbx-direct/cargo-home
      CARGO_TARGET_DIR: /github/home/mbx-direct/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: driver
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/hk
          ref: 27bb615768b85c9ac88e2abf8895219b44462871
          path: subject
          persist-credentials: false
      - uses: jdx/mr-boxington-action@f9de1362243ccf1c4f11a56c240725d0371ef4fa
        with:
          backend: local
          version: ${{ inputs.small_edit_mbx_version || '1.7.0' }}
          toolchain: 1.97.1
      - working-directory: subject
        run: mbx build --locked
      - name: Snapshot Cargo scheduling state
        run: python3 driver/benchmarks/analyze_hydration.py snapshot "$MBX_DIRECT_ROOT" "$(command -v mbx)"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: hk-small-edit-mbx-direct-${{ github.run_id }}-parent
          path: |
            /github/home/mbx-direct/store
            /github/home/mbx-direct/snapshot
            /github/home/mbx-direct/cargo-home/registry

  edit-mbx-direct-measure:
    name: Measure direct hydrated mbx after the edit
    needs: edit-mbx-direct-seed
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/benchmark-small-edit' &&
      (needs.edit-mbx-direct-seed.result == 'success' || inputs.small_edit_cache_run_id != '')
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      MBX_DIRECT_ROOT: /github/home/mbx-direct
      MBX_CACHE_DIR: /github/home/mbx-direct/store
      CARGO_HOME: /github/home/mbx-direct/cargo-home
      CARGO_TARGET_DIR: /github/home/mbx-direct/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: driver
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/hk
          ref: fc29ead1456ba7c1f62826c284126410a4014b00
          path: subject
          persist-credentials: false
      - name: Start end-to-end timer
        run: echo "EDIT_STARTED_NS=$(date +%s%N)" >> "$GITHUB_ENV"
      - uses: jdx/mr-boxington-action@f9de1362243ccf1c4f11a56c240725d0371ef4fa
        with:
          backend: local
          version: ${{ inputs.small_edit_mbx_version || '1.7.0' }}
          toolchain: 1.97.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: hk-small-edit-mbx-direct-${{ inputs.small_edit_cache_run_id || github.run_id }}-parent
          path: |
            /github/home/mbx-direct/store
            /github/home/mbx-direct/snapshot
            /github/home/mbx-direct/cargo-home/registry
      - name: Hydrate Cargo target
        run: python3 driver/benchmarks/analyze_hydration.py hydrate "$MBX_DIRECT_ROOT" "$(command -v mbx)"
      - id: measure
        working-directory: subject
        run: |
          started=$(date +%s%N)
          mbx build --locked
          finished=$(date +%s%N)
          echo "build_duration_ns=$((finished - started))" >> "$GITHUB_OUTPUT"
          echo "total_duration_ns=$((finished - EDIT_STARTED_NS))" >> "$GITHUB_OUTPUT"
      - name: Record result
        env:
          BUILD_DURATION_NS: ${{ steps.measure.outputs.build_duration_ns }}
          TOTAL_DURATION_NS: ${{ steps.measure.outputs.total_duration_ns }}
        run: |
          mkdir -p target/small-edit
          jq -n --arg tool mbx-direct-hydrated \
            --arg version "${{ inputs.small_edit_mbx_version || '1.7.0' }}" \
            --argjson build_duration_ns "$BUILD_DURATION_NS" \
            --argjson restore_and_build_duration_ns "$TOTAL_DURATION_NS" \
            '{tool:$tool, version:$version, build_duration_ns:$build_duration_ns, restore_and_build_duration_ns:$restore_and_build_duration_ns}' \
            > target/small-edit/mbx-direct-hydrated.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: small-edit-mbx-direct-hydrated-${{ github.run_id }}
          path: target/small-edit/mbx-direct-hydrated.json

  edit-report:
    name: Report small-edit comparison
    needs: [edit-rust-cache-measure, edit-mbx-measure, edit-mbx-direct-measure]
    if: >-
      always() &&
      needs.edit-rust-cache-measure.result == 'success' &&
      needs.edit-mbx-measure.result == 'success' &&
      needs.edit-mbx-direct-measure.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: small-edit-*-${{ github.run_id }}
          path: ${{ runner.temp }}/small-edit
          merge-multiple: true
      - name: Compare results
        run: |
          rust_cache_build=$(jq -r .build_duration_ns "$RUNNER_TEMP/small-edit/rust-cache.json")
          rust_cache_total=$(jq -r .restore_and_build_duration_ns "$RUNNER_TEMP/small-edit/rust-cache.json")
          mbx_build=$(jq -r .build_duration_ns "$RUNNER_TEMP/small-edit/mbx.json")
          mbx_total=$(jq -r .restore_and_build_duration_ns "$RUNNER_TEMP/small-edit/mbx.json")
          direct_build=$(jq -r .build_duration_ns "$RUNNER_TEMP/small-edit/mbx-direct-hydrated.json")
          direct_total=$(jq -r .restore_and_build_duration_ns "$RUNNER_TEMP/small-edit/mbx-direct-hydrated.json")
          jq -n --argjson rust_cache_build "$rust_cache_build" \
            --argjson rust_cache_total "$rust_cache_total" \
            --argjson mbx_build "$mbx_build" --argjson mbx_total "$mbx_total" \
            --argjson direct_build "$direct_build" --argjson direct_total "$direct_total" \
            '{rust_cache:{build_seconds:($rust_cache_build / 1e9),restore_and_build_seconds:($rust_cache_total / 1e9)},mbx:{build_seconds:($mbx_build / 1e9),restore_and_build_seconds:($mbx_total / 1e9)},mbx_direct_hydrated:{build_seconds:($direct_build / 1e9),restore_and_build_seconds:($direct_total / 1e9)},mbx_end_to_end_speedup:($rust_cache_total / $mbx_total),mbx_direct_hydrated_end_to_end_speedup:($rust_cache_total / $direct_total)}' \
            | tee "$RUNNER_TEMP/small-edit/comparison.json"
          {
            echo '## hk small-edit comparison'
            echo
            echo '| Tool | Restore + build | Build only |'
            echo '| :--- | ---: | ---: |'
            printf '| rust-cache | %.2f s | %.2f s |\n' \
              "$(awk "BEGIN {print $rust_cache_total / 1000000000}")" \
              "$(awk "BEGIN {print $rust_cache_build / 1000000000}")"
            printf '| mbx | %.2f s | %.2f s |\n' \
              "$(awk "BEGIN {print $mbx_total / 1000000000}")" \
              "$(awk "BEGIN {print $mbx_build / 1000000000}")"
            printf '| mbx direct + hydrated | %.2f s | %.2f s |\n' \
              "$(awk "BEGIN {print $direct_total / 1000000000}")" \
              "$(awk "BEGIN {print $direct_build / 1000000000}")"
          } >> "$GITHUB_STEP_SUMMARY"
