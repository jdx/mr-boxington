name: bench-refresh

on:
  schedule:
    # Weekly, away from the top of the hour. A real-world benchmark is an hour
    # of runner time per pass; nightly would buy churn rather than signal.
    - cron: "41 4 * * 2"
  workflow_dispatch:
    inputs:
      force:
        description: Rerun the benchmark even when mbx's version has not changed
        required: false
        type: boolean
        default: false
      small_edit:
        description: Compare restored parent caches after hk's next small edit
        required: false
        type: boolean
        default: false
      small_edit_mbx_version:
        description: Released mbx version used by the small-edit comparison
        required: false
        type: string
        default: "1.8.0"
      small_edit_mbx_ref:
        description: Build this mr-boxington ref instead of installing a release
        required: false
        type: string
        default: ""
      small_edit_mbx_artifact_run:
        description: Earlier workflow run containing the candidate mbx artifact
        required: false
        type: string
        default: ""
      small_edit_trials:
        description: JSON array of trial numbers (use [1] for a smoke test)
        required: false
        type: string
        default: "[1,2,3,4]"

permissions: {}

# Two refreshes would race the force-push to the shared `bench-refresh`
# branch. A manual dispatch supersedes an in-flight scheduled run.
concurrency:
  group: bench-refresh
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Rust 1.97.1 is part of the digest-pinned benchmark image.
  MISE_DISABLE_TOOLS: rust
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  # Only benchmark when the mbx that produced the published numbers is older
  # than the latest release. A docs or chore push does not invalidate a timing,
  # and benchmarking an unreleased checkout would publish numbers users cannot
  # reproduce with the version they can install.
  check:
    name: Check version drift
    if: github.event_name != 'workflow_dispatch' || !inputs.small_edit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      release: ${{ steps.drift.outputs.release }}
      bench: ${{ steps.drift.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare latest release against published benchmark
        id: drift
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh release view --json tagName --jq '.tagName | ltrimstr("v")')
          # Absent until the first refresh lands, which is itself drift.
          BENCH=$(jq -r '.versions.mbx // empty' benchmarks/results.json 2>/dev/null || true)
          if [ -z "$RELEASE" ]; then
            echo "::error::Could not resolve the latest mbx release"
            exit 1
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "bench=$BENCH" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_REFRESH" = "true" ] || [ "$BENCH" != "$RELEASE" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    name: Refresh benchmarks
    needs: check
    if: needs.check.outputs.drift == 'true'
    # Keep the runner class fixed: the six-job contention scenario needs enough
    # CPU to reproduce the large parallel CI job it models, and timings cannot
    # be compared across machine classes. The host-wide lease serializes this
    # with every other jdx performance job.
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      options: --cpuset-cpus 0-7
    # The full refresh also runs every cache scenario and the toolchain guard.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install: false
        env:
          MISE_LOCKED: "1"
      # The comparison should track kache itself, not the version that happened
      # to be current when mise.lock was last updated. Install the newest stable
      # release explicitly, then keep its real path for builds that run outside
      # this repository (where a mise shim cannot resolve this configuration).
      - name: Install latest benchmark comparator
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_LOCKED: "0"
        run: |
          mise install github:kunobi-ninja/kache@latest
          echo "KACHE_INSTALL_DIR=$(mise where github:kunobi-ninja/kache@latest)" \
            >> "$GITHUB_ENV"
      - name: Runner metadata
        run: |
          {
            echo '### Runner metadata'
            echo '```text'
            echo 'environment-revision: perf-runner@fd66d9b'
            echo 'image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68'
            uname -a
            lscpu
            mise --version
            rustc --version
            cargo --version
            valgrind --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install released mbx
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: v${{ needs.check.outputs.release }}
        run: |
          archive=mbx-x86_64-unknown-linux-gnu.tar.gz
          install_dir="$RUNNER_TEMP/mbx-release"
          mkdir -p "$install_dir"
          gh release download "$RELEASE" \
            --pattern "$archive" \
            --pattern SHA256SUMS \
            --dir "$install_dir"
          grep "  $archive$" "$install_dir/SHA256SUMS" \
            | (cd "$install_dir" && sha256sum --check --strict -)
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          echo "MBX_BENCH_BINARY=$install_dir/mbx" >> "$GITHUB_ENV"
      # Clippy for 1.97.1 and the alternate 1.96.0 toolchain are part of the
      # pinned image, so this job never needs static.rust-lang.org at runtime.
      - name: Refresh benchmarks
        env:
          MBX_BENCH_ALTERNATE_TOOLCHAIN: 1.96.0
          MISE_LOCKED: "1"
        run: |
          PATH="$KACHE_INSTALL_DIR:$PATH" \
            python3 benchmarks/real_world.py \
            --mbx "$MBX_BENCH_BINARY" \
            --scenarios cold,warm,commit,worktree,toolchain,contention \
            --output target/benchmarks \
            --write-results benchmarks/results.json
      - name: Publish job summary
        if: always()
        # A run that failed before writing its summary has already reported
        # why; a missing file here would only add a second, less informative
        # red step on top of it.
        run: |
          if [ -f target/benchmarks/real-world.md ]; then
            cat target/benchmarks/real-world.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The benchmark did not get as far as writing a summary." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mbx-real-world-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmarks
          if-no-files-found: error
          retention-days: 90
      - name: Upload refreshed results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-json-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/results.json
          if-no-files-found: error

  # Opening the pull request is a separate job so the benchmark itself never
  # holds write permission, and so a benchmark whose numbers are invalid can
  # never reach the site.
  propose:
    name: Propose the refreshed numbers
    needs: [check, refresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: results-json-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/refreshed
      - name: Stage the refreshed results
        run: cp "$RUNNER_TEMP/refreshed/results.json" benchmarks/results.json
      - name: Check for a diff
        id: dirty
        run: |
          if git diff --quiet -- benchmarks/results.json \
            && [ -z "$(git status --porcelain -- benchmarks/results.json)" ]; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi
      # One reused branch, always force-pushed: the previous numbers are
      # superseded by these, never added to. Reusing it preserves the PR.
      - name: Force-push the bench-refresh branch
        if: steps.dirty.outputs.dirty == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bench-refresh
          git add benchmarks/results.json
          git commit -m "chore: refresh real-world benchmarks"
          # persist-credentials: false means the push has to authenticate
          # explicitly. Re-point origin rather than pushing to a one-shot URL,
          # so --force-with-lease has a remote-tracking ref to compare with.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch origin bench-refresh || true
          git push --force-with-lease -u origin HEAD:refs/heads/bench-refresh
      - name: Create or update the pull request
        if: steps.dirty.outputs.dirty == 'true'
        env:
          # The same credential release-plz uses to open its pull requests.
          # The default token cannot: this repository does not let Actions
          # create them, and one it opened would not start CI anyway.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASE: ${{ needs.check.outputs.release }}
          BENCH: ${{ needs.check.outputs.bench }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/body.md" <<EOF
          ## Refreshed real-world benchmarks

          \`benchmarks/results.json\` was measured with \`${BENCH:-no previous run}\`; the latest release is now \`mbx ${RELEASE}\`. Re-ran the benchmark with that release on the dedicated performance runner: a pinned checkout of jdx/hk built under raw cargo, mbx, and kache across the cold, warm, next-commit, cross-worktree, toolchain-change, and six-job contention scenarios.

          The [run summary](${RUN_URL}) has the table these numbers came from, and the run's artifacts have the per-build logs.

          **Read the numbers before merging.** They publish to https://mr-boxington.jdx.dev/benchmarks on merge. A scenario that swapped places is worth investigating before it goes on the site.

          ---
          Generated by the \`bench-refresh\` workflow.
          EOF
          EXISTING=$(gh pr list --state open --head bench-refresh --json number --jq '.[0].number // empty')
          TITLE="chore: refresh real-world benchmarks for mbx v${RELEASE}"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head bench-refresh \
              --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  small-edit-build-mbx:
    name: Build candidate mbx
    if: github.event_name == 'workflow_dispatch' && inputs.small_edit && inputs.small_edit_mbx_ref != '' && inputs.small_edit_mbx_artifact_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.small_edit_mbx_ref }}
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Build candidate
        run: cargo build --locked --release -p mbx
      - name: Stage candidate
        run: |
          mkdir -p "$RUNNER_TEMP/mbx-bin"
          cp target/release/mbx "$RUNNER_TEMP/mbx-bin/mbx"
          git rev-parse HEAD > "$RUNNER_TEMP/mbx-bin/source-revision"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-small-edit-mbx-binary
          path: ${{ runner.temp }}/mbx-bin
          if-no-files-found: error
          retention-days: 7

  small-edit-seed:
    name: Seed ${{ matrix.tool }} (${{ matrix.trial }})
    needs: small-edit-build-mbx
    if: always() && github.event_name == 'workflow_dispatch' && inputs.small_edit && (needs.small-edit-build-mbx.result == 'success' || needs.small-edit-build-mbx.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        trial: ${{ fromJSON(inputs.small_edit_trials || '[1,2,3,4]') }}
        tool: [rust-cache, mbx-target]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    env:
      MBX_CACHE_EXPORT_GROUP: gha-small-edit-${{ github.run_id }}-${{ matrix.trial }}
      MBX_TARGET_VIEWS: ${{ matrix.tool == 'mbx-target' && '0' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/hk
          ref: 27bb615768b85c9ac88e2abf8895219b44462871
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Download candidate mbx
        if: inputs.small_edit_mbx_ref != '' && matrix.tool != 'rust-cache'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gha-small-edit-mbx-binary
          path: ${{ runner.temp }}/mbx-bin
          run-id: ${{ inputs.small_edit_mbx_artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Select candidate mbx
        if: inputs.small_edit_mbx_ref != '' && matrix.tool != 'rust-cache'
        run: |
          chmod +x "$RUNNER_TEMP/mbx-bin/mbx"
          echo "$RUNNER_TEMP/mbx-bin" >> "$GITHUB_PATH"
      - if: matrix.tool == 'rust-cache'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          shared-key: gha-small-edit-${{ github.run_id }}-${{ matrix.trial }}
          add-job-id-key: "false"
          workspaces: . -> target
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - if: matrix.tool == 'mbx'
        uses: jdx/mr-boxington-action@f9de1362243ccf1c4f11a56c240725d0371ef4fa # v1.2.0
        with:
          version: ${{ inputs.small_edit_mbx_ref == '' && inputs.small_edit_mbx_version || '' }}
          cache-key: gha-small-edit-mbx-${{ github.run_id }}-${{ matrix.trial }}-parent
          save-on-workflow-dispatch: "true"
          toolchain: 1.97.1
      - if: matrix.tool == 'mbx-target'
        uses: jdx/mr-boxington-action@ce762ec323125600a1bcc73750f6e01ec3deb328
        with:
          backend: github
          cache-links: "false"
          cache-key: gha-small-edit-${{ matrix.tool }}-${{ github.run_id }}-${{ matrix.trial }}-parent
          github-cache-mode: target
          save-on-workflow-dispatch: "true"
          version: ${{ inputs.small_edit_mbx_ref == '' && inputs.small_edit_mbx_version || '' }}
          toolchain: 1.97.1
      - name: Seed parent build
        env:
          BUILD_DRIVER: "${{ matrix.tool == 'rust-cache' && 'cargo' || 'mbx' }}"
        run: |
          "$BUILD_DRIVER" build --locked
      - name: Prune target like rust-cache
        if: false
        shell: python
        run: |
          import json
          import pathlib
          import shutil
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--format-version", "1", "--locked",
          ]))
          packages = metadata["packages"]
          keep_pkg = {
              name
              for package in packages
              for name in [package["name"], *(target["name"].replace("-", "_") for target in package["targets"])]
          }
          keep_deps = {
              name
              for package in packages
              for raw_name in [package["name"], *(target["name"] for target in package["targets"])]
              for name in (raw_name.replace("-", "_"), f"lib{raw_name.replace('-', '_')}")
          }
          keep_registry = {package["name"] for package in packages}

          def remove(path):
              if path.is_dir() and not path.is_symlink():
                  shutil.rmtree(path)
              else:
                  path.unlink(missing_ok=True)

          def matches(entry, keep):
              name = entry.name
              if name in keep:
                  return True
              stem, separator, _hash = name.rpartition("-")
              return bool(separator and stem in keep)

          def prune_profile(profile):
              for entry in profile.iterdir():
                  if entry.name not in {"build", ".fingerprint", "deps", ".mbx-build-script-shims"}:
                      remove(entry)
              for dirname, keep in (("build", keep_pkg), (".fingerprint", keep_pkg), ("deps", keep_deps)):
                  directory = profile / dirname
                  if not directory.is_dir():
                      continue
                  for entry in directory.iterdir():
                      if not matches(entry, keep):
                          remove(entry)

          def prune_target(directory):
              for entry in list(directory.iterdir()):
                  if not entry.is_dir():
                      if entry.name != "CACHEDIR.TAG":
                          remove(entry)
                      continue
                  if any((entry / marker).exists() for marker in ("build", ".fingerprint", "deps")):
                      prune_profile(entry)
                  else:
                      prune_target(entry)

          prune_target(pathlib.Path("target"))

          def prune_sparse_index(directory):
              empty = True
              for entry in list(directory.iterdir()):
                  if entry.is_dir():
                      if prune_sparse_index(entry):
                          remove(entry)
                      else:
                          empty = False
                  elif entry.name in keep_registry:
                      empty = False
                  else:
                      remove(entry)
              return empty

          registry_index = pathlib.Path.home() / ".cargo" / "registry" / "index"
          if registry_index.is_dir():
              for index in registry_index.iterdir():
                  if not index.is_dir():
                      continue
                  if (index / ".git").is_dir():
                      remove(index / ".cache")
                  else:
                      prune_sparse_index(index)

      - name: Export native mbx bundle
        if: matrix.tool == 'mbx-registry'
        run: mbx cache export --group "$MBX_CACHE_EXPORT_GROUP" "$RUNNER_TEMP/mbx-cache.tar"
      - if: matrix.tool == 'mbx-registry'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: gha-small-edit-${{ matrix.tool }}-${{ github.run_id }}-${{ matrix.trial }}-parent
          path: |
            ${{ runner.temp }}/mbx-cache.tar
            ~/.cargo/registry
            ~/.cargo/git
      - if: false
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: gha-small-edit-${{ matrix.tool }}-${{ github.run_id }}-${{ matrix.trial }}-parent
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git

  small-edit-measure:
    name: Measure pair ${{ matrix.trial }} (${{ matrix.order }})
    needs: small-edit-seed
    # `small-edit-seed` deliberately tolerates the candidate-build job being
    # skipped when benchmarking a released mbx. Preserve that tolerance here:
    # without `always()`, GitHub propagates the transitive skipped dependency
    # and silently skips this matrix even though every seed job succeeded.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.small_edit && needs.small-edit-seed.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trial: ${{ fromJSON(inputs.small_edit_trials || '[1,2,3,4]') }}
        order: [rust-first, mbx-first]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      MBX_TARGET_VIEWS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/hk
          ref: fc29ead1456ba7c1f62826c284126410a4014b00
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Download candidate mbx
        if: inputs.small_edit_mbx_ref != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gha-small-edit-mbx-binary
          path: ${{ runner.temp }}/mbx-bin
          run-id: ${{ inputs.small_edit_mbx_artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Select candidate mbx
        if: inputs.small_edit_mbx_ref != ''
        run: |
          chmod +x "$RUNNER_TEMP/mbx-bin/mbx"
          echo "$RUNNER_TEMP/mbx-bin" >> "$GITHUB_PATH"
      - name: Start rust-cache timer (first)
        if: matrix.order == 'rust-first'
        id: rust_first_timer
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - if: matrix.order == 'rust-first'
        id: rust_first_restore
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          shared-key: gha-small-edit-${{ github.run_id }}-${{ matrix.trial }}
          add-job-id-key: "false"
          workspaces: . -> target
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: "false"
      - name: Build edited commit with rust-cache (first)
        if: matrix.order == 'rust-first'
        id: rust_first_build
        env:
          STARTED_NS: ${{ steps.rust_first_timer.outputs.started_ns }}
        run: |
          started=$(date +%s%N)
          cargo build --locked
          finished=$(date +%s%N)
          echo "build_duration_ns=$((finished - started))" >> "$GITHUB_OUTPUT"
          echo "total_duration_ns=$((finished - STARTED_NS))" >> "$GITHUB_OUTPUT"
      - name: Clear first target tree
        if: matrix.order == 'rust-first'
        run: find "$GITHUB_WORKSPACE/target" -mindepth 1 -delete
      - name: Start mbx timer
        id: mbx_timer
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - id: mbx_restore
        uses: jdx/mr-boxington-action@ce762ec323125600a1bcc73750f6e01ec3deb328
        with:
          backend: github
          cache-links: "false"
          github-cache-mode: target
          version: ${{ inputs.small_edit_mbx_ref == '' && inputs.small_edit_mbx_version || '' }}
          toolchain: 1.97.1
          cache-key: gha-small-edit-mbx-target-${{ github.run_id }}-${{ matrix.trial }}-parent
      - id: mbx_build
        name: Build edited commit with mbx
        env:
          STARTED_NS: ${{ steps.mbx_timer.outputs.started_ns }}
          MBX_REPORT: ${{ runner.temp }}/mbx-report.json
        run: |
          started=$(date +%s%N)
          mbx build --locked
          finished=$(date +%s%N)
          echo "build_duration_ns=$((finished - started))" >> "$GITHUB_OUTPUT"
          echo "total_duration_ns=$((finished - STARTED_NS))" >> "$GITHUB_OUTPUT"
      - name: Clear target tree before rust-cache (second)
        if: matrix.order == 'mbx-first'
        run: find "$GITHUB_WORKSPACE/target" -mindepth 1 -delete
      - name: Start rust-cache timer (second)
        if: matrix.order == 'mbx-first'
        id: rust_second_timer
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - if: matrix.order == 'mbx-first'
        id: rust_second_restore
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          shared-key: gha-small-edit-${{ github.run_id }}-${{ matrix.trial }}
          add-job-id-key: "false"
          workspaces: . -> target
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: "false"
      - name: Build edited commit with rust-cache (second)
        if: matrix.order == 'mbx-first'
        id: rust_second_build
        env:
          STARTED_NS: ${{ steps.rust_second_timer.outputs.started_ns }}
        run: |
          started=$(date +%s%N)
          cargo build --locked
          finished=$(date +%s%N)
          echo "build_duration_ns=$((finished - started))" >> "$GITHUB_OUTPUT"
          echo "total_duration_ns=$((finished - STARTED_NS))" >> "$GITHUB_OUTPUT"
      # Validate after timing so assertions do not bias either arm.
      - name: Require both parent-cache hits
        env:
          RUST_CACHE_HIT: ${{ matrix.order == 'rust-first' && steps.rust_first_restore.outputs.cache-hit || steps.rust_second_restore.outputs.cache-hit }}
          MBX_CACHE_HIT: ${{ steps.mbx_restore.outputs.cache-hit }}
        run: |
          test "$RUST_CACHE_HIT" = true || { echo "::error::rust-cache did not restore the seeded parent cache"; exit 1; }
          test "$MBX_CACHE_HIT" = true || { echo "::error::mbx did not restore the seeded parent cache"; exit 1; }
      - name: Record paired trial
        env:
          RUST_BUILD_NS: ${{ matrix.order == 'rust-first' && steps.rust_first_build.outputs.build_duration_ns || steps.rust_second_build.outputs.build_duration_ns }}
          RUST_TOTAL_NS: ${{ matrix.order == 'rust-first' && steps.rust_first_build.outputs.total_duration_ns || steps.rust_second_build.outputs.total_duration_ns }}
          MBX_BUILD_NS: ${{ steps.mbx_build.outputs.build_duration_ns }}
          MBX_TOTAL_NS: ${{ steps.mbx_build.outputs.total_duration_ns }}
          TRIAL: ${{ matrix.trial }}-${{ matrix.order }}
          REF: ${{ inputs.small_edit_mbx_ref }}
          VERSION: ${{ inputs.small_edit_mbx_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/small-edit"
          if [ -n "$REF" ]; then
            VERSION=""
            REVISION=$(cat "$RUNNER_TEMP/mbx-bin/source-revision")
          else
            REVISION=""
          fi
          jq -n --arg tool rust-cache --arg trial "$TRIAL" --arg ref "$REF" --arg revision "$REVISION" --arg version "$VERSION" \
            --argjson build_duration_ns "$RUST_BUILD_NS" --argjson restore_and_build_duration_ns "$RUST_TOTAL_NS" \
            '{schema:1,tool:$tool,mbx_version:$version,mbx_ref:$ref,mbx_revision:$revision,trial:$trial,build_duration_ns:$build_duration_ns,restore_and_build_duration_ns:$restore_and_build_duration_ns}' \
            > "$RUNNER_TEMP/small-edit/rust-cache-${TRIAL}.json"
          jq -n --arg tool mbx-target --arg trial "$TRIAL" --arg ref "$REF" --arg revision "$REVISION" --arg version "$VERSION" \
            --argjson build_duration_ns "$MBX_BUILD_NS" --argjson restore_and_build_duration_ns "$MBX_TOTAL_NS" \
            '{schema:1,tool:$tool,mbx_version:$version,mbx_ref:$ref,mbx_revision:$revision,trial:$trial,build_duration_ns:$build_duration_ns,restore_and_build_duration_ns:$restore_and_build_duration_ns}' \
            > "$RUNNER_TEMP/small-edit/mbx-target-${TRIAL}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-small-edit-pair-${{ matrix.trial }}-${{ matrix.order }}
          path: ${{ runner.temp }}/small-edit/*.json
          if-no-files-found: error
          retention-days: 90

  small-edit-report:
    name: Report small-edit comparison
    needs: small-edit-measure
    if: always() && needs.small-edit-measure.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gha-small-edit-*
          path: ${{ runner.temp }}/small-edit
          merge-multiple: true
      - name: Summarize medians
        env:
          TRIALS: ${{ inputs.small_edit_trials || '[1,2,3,4]' }}
        run: |
          set -o pipefail
          trial_count=$(jq -er \
            'if type == "array" and length > 0 then length else error("expected a non-empty trial array") end' \
            <<< "$TRIALS")
          expected=$((4 * trial_count))
          shopt -s nullglob
          records=("$RUNNER_TEMP"/small-edit/*.json)
          actual=${#records[@]}
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected $expected trial records, found $actual"
            exit 1
          fi
          jq -s '
            def median:
              sort as $values |
              ($values | length) as $length |
              if $length % 2 == 1 then $values[$length / 2 | floor]
              else (($values[$length / 2 - 1] + $values[$length / 2]) / 2) end;
            group_by(.tool) | map({
              tool: .[0].tool,
              mbx_version: .[0].mbx_version,
              mbx_ref: .[0].mbx_ref,
              mbx_revision: .[0].mbx_revision,
              trials: length,
              build_seconds: (([.[].build_duration_ns] | median) / 1e9),
              restore_and_build_seconds: (([.[].restore_and_build_duration_ns] | median) / 1e9)
            })' "$RUNNER_TEMP"/small-edit/*.json \
            | tee "$RUNNER_TEMP/small-edit-summary.json"
          {
            echo '## hk parent-cache + small-edit comparison'
            echo
            echo '| Tool | Trials | Median restore + build | Median build |'
            echo '| :--- | ---: | ---: | ---: |'
            jq -r '.[] | "| \(.tool) | \(.trials) | \(.restore_and_build_seconds * 100 | round / 100) s | \(.build_seconds * 100 | round / 100) s |"' \
              "$RUNNER_TEMP/small-edit-summary.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-small-edit-summary
          path: ${{ runner.temp }}/small-edit-summary.json
          if-no-files-found: error
          retention-days: 90
