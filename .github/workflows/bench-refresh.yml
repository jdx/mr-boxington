name: repair performance runner cache

on:
  workflow_dispatch:

permissions: {}

jobs:
  repair:
    runs-on: [self-hosted, jdx-perf-v1]
    timeout-minutes: 10
    container:
      image: ghcr.io/jdx/perf-runner@sha256:5263c143b12ce2234e7b0b21d3d6501c2ed05837b42937d0eaeaa191cd5c8e68
      # Docker's volume syntax creates the missing bind source before startup.
      options: --user 0:0 --volume /var/cache/jdx-perf/mbx:/var/cache/mbx
    steps:
      - name: Repair and verify persistent cache
        run: |
          chown 1001:1001 /var/cache/mbx
          chmod 0750 /var/cache/mbx
          test "$(stat -c '%u:%g %a' /var/cache/mbx)" = "1001:1001 750"
          stat -c '%A %U:%G %u:%g %n' /var/cache/mbx
