name: contention experiment

# Temporary PR-only workflow. Once the runner shape is proven, bench-refresh
# takes it over and this workflow is removed before merge.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/contention-experiment.yml
      - benchmarks/real_world.py

permissions: {}

concurrency:
  group: contention-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Six-job contention benchmark
    # This executes PR code on a private runner. Keep the experiment limited to
    # jdx's same-repository branch; fork PRs must never reach this machine.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'jdx'
    runs-on: namespace-profile-endev-linux-amd64-xlarge
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
      - name: Install Clippy for the benchmark toolchain
        run: rustup component add clippy
      - name: Build mbx
        run: mise run perf:prepare
      - name: Measure sequential and parallel strategies
        run: |
          python3 benchmarks/real_world.py \
            --mbx target/release/mbx \
            --tools mbx-sequential,mbx-unscheduled,mbx \
            --scenarios contention \
            --output target/contention-experiment
      - name: Publish comparison
        if: always()
        run: |
          if [ ! -f target/contention-experiment/real-world.json ]; then
            echo "The benchmark failed before producing results." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("target/contention-experiment/real-world.json").read_text())
          cells = {cell["tool"]: cell for cell in result["scenarios"][0]["results"]}
          control = cells["mbx-unscheduled"]
          scheduled = cells["mbx"]
          saved = (control["wall_duration_ns"] - scheduled["wall_duration_ns"]) / 1e9
          percent = saved / (control["wall_duration_ns"] / 1e9) * 100
          print("## Six-job contention experiment\n")
          print(f"**mbx scheduling saved {saved:.1f}s ({percent:.1f}%) against the parallel control.**\n")
          print("| strategy | wall time | peak compilers | minimum free memory |")
          print("| :--- | ---: | ---: | ---: |")
          for tool in ("mbx-sequential", "mbx-unscheduled", "mbx"):
              cell = cells[tool]
              wall = cell["wall_duration_ns"] / 1e9
              memory = cell["min_available_bytes"] / 1e9
              print(f"| {tool} | {wall:.1f}s | {cell['peak_compilers']} | {memory:.1f} GB |")
          PY
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contention-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/contention-experiment
          if-no-files-found: error
          retention-days: 30
