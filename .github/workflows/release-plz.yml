name: release-plz

# release-plz watches main, opens a release PR that bumps versions and writes
# the changelog, and on merge tags, publishes to crates.io and drafts the
# GitHub release. `release.yml` then attaches binaries and this workflow
# publishes the draft.

permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time. Two runs would both publish: the release job creates tags
# and pushes crates to crates.io, and a second run reaching that step while the
# first is mid-publish either duplicates a version or fails half-way through a
# workspace, leaving some crates released and some not. A queued run is also
# correct on its own terms -- it re-reads main and finds the work already done.
#
# `cancel-in-progress: false` is the whole point: cancelling a publish is worse
# than waiting for one. Merges to main are rare enough that the queue is short.
#
# Deliberately at workflow level rather than per job, so it also covers the
# release job racing the *next* run's release-pr job, which rewrites the very
# branch the release reads. One group here replaces the job-level guard the
# release-pr job used to carry; repeating the same group name on a job inside a
# run that already holds it risks the job waiting on its own run's lock.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release
    runs-on: namespace-profile-endev-linux-amd64
    # Forks should never attempt to publish.
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      # Required for crates.io trusted publishing: the OIDC token proves this
      # workflow, in this repository, is the configured publisher. No
      # long-lived CARGO_REGISTRY_TOKEN exists anywhere.
      id-token: write
      pull-requests: read
    outputs:
      tag: ${{ steps.mbx-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the merged release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null) | select(.head.ref | startswith("release-plz-"))][0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Trusted publishing cannot create a crate. Bootstrap the protocol crate
      # with a token restricted to `publish-new`, then wait until crates.io can
      # see that exact version so release-plz recognizes it as already
      # published. Once the crate exists this step never reads or uses the
      # token; later versions use OIDC with the rest of the workspace.
      - name: Bootstrap mbx-cache-protocol on crates.io
        if: steps.release-pr.outputs.number != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_NEW_TOKEN }}
        run: |
          crate=mbx-cache-protocol
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r --arg crate "$crate" '.packages[] | select(.name == $crate).version')
          crate_endpoint="https://crates.io/api/v1/crates/$crate"
          version_endpoint="$crate_endpoint/$version"
          user_agent="mr-boxington release workflow (https://github.com/${{ github.repository }})"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent "$user_agent" "$crate_endpoint")

          if [ "$status" = 200 ]; then
            echo "$crate already exists; release-plz will publish version $version with OIDC"
            exit 0
          fi
          if [ "$status" != 404 ]; then
            echo "::error::crates.io returned HTTP $status while checking $crate $version"
            exit 1
          fi

          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CRATES_IO_PUBLISH_NEW_TOKEN is required to publish the first $crate release"
            exit 1
          fi

          cargo publish --locked --package "$crate"

          # The publish endpoint can return before the new version is visible
          # to release-plz through the crates.io API.
          for _ in $(seq 1 12); do
            if curl --fail --silent --show-error --user-agent "$user_agent" "$version_endpoint" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::$crate $version did not become visible on crates.io"
          exit 1

      # Exchanges the OIDC token for a short-lived crates.io token. Each crate
      # needs a Trusted Publisher naming this repository and this workflow
      # file, so renaming this file breaks publishing.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      # This is a workspace: a run can release `mbx`, any library, or all of
      # them, in whatever order release-plz reports. Taking `releases[0]` would
      # sometimes hand the binary-upload job a library's tag — attaching `mbx`
      # binaries to the wrong release and leaving the real one drafted forever.
      # Select by name instead.
      - name: Find the mbx tag
        id: mbx-tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=""
          if [ -n "$RELEASES" ]; then
            tag=$(jq -r '[.[] | select(.package_name == "mbx")][0].tag // ""' <<<"$RELEASES")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mbx tag: ${tag:-<none released>}"

      # An empty result is expected when re-running a completed release, or
      # when bootstrapping the protocol crate was the only work. Verify the
      # desired end state instead of rejecting those idempotent cases.
      - name: Verify an empty release result for a merged release PR
        if: steps.mbx-tag.outputs.tag == '' && steps.release-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          user_agent="mr-boxington release workflow (https://github.com/${{ github.repository }})"
          failed=false

          while read -r crate version; do
            endpoint="https://crates.io/api/v1/crates/$crate/$version"
            if ! curl --fail --silent --show-error --user-agent "$user_agent" "$endpoint" >/dev/null; then
              echo "::error::$crate $version is not published on crates.io"
              failed=true
            fi
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '
            .workspace_members as $members
            | .packages[]
            | select(.id as $id | $members | index($id))
            | select(.publish == null or (.publish | length > 0))
            | [.name, .version]
            | @tsv')

          mbx_version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mbx").version')
          if ! gh release view "v$mbx_version" --repo "${{ github.repository }}" >/dev/null; then
            echo "::error::GitHub release v$mbx_version does not exist"
            failed=true
          fi

          if [ "$failed" = true ]; then
            exit 1
          fi

  # Binaries are attached to the draft, then the draft is published — so a
  # release is never visible without its assets.
  upload-assets:
    name: Upload assets
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}
    secrets:
      CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
      CERTIFICATES_P12_PASS: ${{ secrets.CERTIFICATES_P12_PASS }}

  publish-release:
    name: Publish release
    needs: [release-plz-release, upload-assets]
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    runs-on: namespace-profile-endev-linux-amd64
    permissions:
      contents: write
    steps:
      - name: Undraft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  release-plz-pr:
    name: Release PR
    runs-on: namespace-profile-endev-linux-amd64
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install documentation tools
        if: steps.release-plz.outputs.prs_created == 'true'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Update generated documentation in the release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r '.head_branch' <<<"$RELEASE_PR")
          git fetch origin "$branch"
          git switch --force-create "$branch" FETCH_HEAD
          mise run render:docs

          if git diff --quiet -- docs/cli &&
            test -z "$(git status --porcelain --untracked-files=all -- docs/cli)"; then
            echo "Generated documentation is already current"
            exit 0
          fi

          git add docs/cli
          git commit -m "docs: update generated CLI reference"
          git push origin "HEAD:$branch"
