name: release-plz

# release-plz watches main, opens a release PR that bumps versions and writes
# the changelog, and on merge tags, publishes to crates.io and drafts the
# GitHub release. `release.yml` then attaches binaries and this workflow
# publishes the draft.

permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time. Two runs would both publish: the release job creates tags
# and pushes crates to crates.io, and a second run reaching that step while the
# first is mid-publish either duplicates a version or fails half-way through a
# workspace, leaving some crates released and some not. A queued run is also
# correct on its own terms -- it re-reads main and finds the work already done.
#
# `cancel-in-progress: false` is the whole point: cancelling a publish is worse
# than waiting for one. Merges to main are rare enough that the queue is short.
#
# Deliberately at workflow level rather than per job, so it also covers the
# release job racing the *next* run's release-pr job, which rewrites the very
# branch the release reads. One group here replaces the job-level guard the
# release-pr job used to carry; repeating the same group name on a job inside a
# run that already holds it risks the job waiting on its own run's lock.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release
    runs-on: namespace-profile-endev-linux-amd64
    # Forks should never attempt to publish.
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      # Required for crates.io trusted publishing: the OIDC token proves this
      # workflow, in this repository, is the configured publisher. No
      # long-lived CARGO_REGISTRY_TOKEN exists anywhere.
      id-token: write
      pull-requests: read
    outputs:
      tag: ${{ steps.mbx-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the merged release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null) | select(.head.ref | startswith("release-plz-"))][0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Exchanges the OIDC token for a short-lived crates.io token. Each crate
      # needs a Trusted Publisher naming this repository and this workflow
      # file, so renaming this file breaks publishing.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      # This is a workspace: a run can release `mbx`, any library, or all of
      # them, in whatever order release-plz reports. Taking `releases[0]` would
      # sometimes hand the binary-upload job a library's tag — attaching `mbx`
      # binaries to the wrong release and leaving the real one drafted forever.
      # Select by name instead.
      - name: Find the mbx tag
        id: mbx-tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=""
          if [ -n "$RELEASES" ]; then
            tag=$(jq -r '[.[] | select(.package_name == "mbx")][0].tag // ""' <<<"$RELEASES")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mbx tag: ${tag:-<none released>}"

      # An empty result is expected when re-running a completed release.
      # Verify the desired end state instead of rejecting that idempotent case.
      - name: Verify an empty release result for a merged release PR
        if: steps.mbx-tag.outputs.tag == '' && steps.release-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          user_agent="mr-boxington release workflow (https://github.com/${{ github.repository }})"
          failed=false

          while read -r crate version; do
            endpoint="https://crates.io/api/v1/crates/$crate/$version"
            if ! curl --fail --silent --show-error --user-agent "$user_agent" "$endpoint" >/dev/null; then
              echo "::error::$crate $version is not published on crates.io"
              failed=true
            fi
          done < <(cargo metadata --no-deps --format-version 1 | jq -r '
            .workspace_members as $members
            | .packages[]
            | select(.id as $id | $members | index($id))
            | select(.publish == null or (.publish | length > 0))
            | [.name, .version]
            | @tsv')

          mbx_version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mbx").version')
          if ! gh release view "v$mbx_version" --repo "${{ github.repository }}" >/dev/null; then
            echo "::error::GitHub release v$mbx_version does not exist"
            failed=true
          fi

          if [ "$failed" = true ]; then
            exit 1
          fi

  # Binaries are attached to the draft, then the draft is published — so a
  # release is never visible without its assets.
  upload-assets:
    name: Upload assets
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}
    secrets:
      CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
      CERTIFICATES_P12_PASS: ${{ secrets.CERTIFICATES_P12_PASS }}
      # Optional: absent, the macOS binary ships signed but un-notarized and
      # the build annotates a warning rather than failing the release.
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  publish-release:
    name: Publish release
    needs: [release-plz-release, upload-assets]
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    runs-on: namespace-profile-endev-linux-amd64
    permissions:
      contents: write
    steps:
      - name: Undraft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  generate-action-assets:
    name: Generate action trust update
    needs: [release-plz-release, upload-assets, publish-release]
    if: ${{ needs.release-plz-release.outputs.tag != '' }}
    runs-on: namespace-profile-endev-linux-amd64
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate the release version
        id: version
        env:
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          version=${TAG#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] ||
            [[ "v$version" != "$TAG" ]]; then
            echo "::error::invalid mbx release tag: $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-plz-release.outputs.tag }}
        run: |
          mkdir release
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern SHA256SUMS \
            --dir release

      - name: Check out the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/mr-boxington-action
          path: action
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare the update
        working-directory: action
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run trust-release -- "$VERSION" ../release/SHA256SUMS
          npm run check
          npm test
          npm run build

      - name: Detect generated changes
        id: changes
        working-directory: action
        run: |
          if git diff --quiet -- src/trusted-release-digests.json dist/index.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated trust files
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-action-assets-${{ steps.version.outputs.version }}
          path: |
            action/src/trusted-release-digests.json
            action/dist/index.js
          retention-days: 1
          if-no-files-found: error

  publish-action-assets:
    name: Propose action trust update
    needs: [release-plz-release, generate-action-assets]
    if: ${{ needs.generate-action-assets.outputs.changed == 'true' }}
    runs-on: namespace-profile-endev-linux-amd64
    permissions:
      contents: read
    steps:
      # No code from the action repository runs in this token-bearing job.
      - name: Check out a fresh action worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdx/mr-boxington-action
          path: action
          persist-credentials: false

      - name: Download generated trust files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-action-assets-${{ needs.generate-action-assets.outputs.version }}
          path: generated

      - name: Commit the update
        working-directory: action
        env:
          VERSION: ${{ needs.generate-action-assets.outputs.version }}
        run: |
          branch="automation/trust-mbx-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git switch --force-create "$branch" origin/main
          cp ../generated/src/trusted-release-digests.json src/trusted-release-digests.json
          cp ../generated/dist/index.js dist/index.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/trusted-release-digests.json dist/index.js
          git -c core.hooksPath=/dev/null commit -m "chore: trust mbx $VERSION release assets"

      - name: Push the update
        working-directory: action
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          VERSION: ${{ needs.generate-action-assets.outputs.version }}
        run: |
          branch="automation/trust-mbx-$VERSION"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push --force-with-lease --set-upstream origin "$branch"

      - name: Open the pull request
        working-directory: action
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          VERSION: ${{ needs.generate-action-assets.outputs.version }}
        run: |
          branch="automation/trust-mbx-$VERSION"
          if gh pr list \
            --repo jdx/mr-boxington-action \
            --head "jdx:$branch" \
            --state open \
            --json number \
            --jq 'length > 0' | grep -qx true; then
            echo "A trust-store pull request for mbx $VERSION is already open"
            exit 0
          fi

          gh pr create \
            --repo jdx/mr-boxington-action \
            --base main \
            --head "$branch" \
            --title "chore: trust mbx $VERSION release assets" \
            --body "Pins the SHA-256 digests published with [mbx $VERSION](https://github.com/jdx/mr-boxington/releases/tag/v$VERSION) and rebuilds the checked-in action bundle."

  release-plz-pr:
    name: Release PR
    runs-on: namespace-profile-endev-linux-amd64
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install documentation tools
        if: steps.release-plz.outputs.prs_created == 'true'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Update generated documentation in the release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r '.head_branch' <<<"$RELEASE_PR")
          git fetch origin "$branch"
          git switch --force-create "$branch" FETCH_HEAD
          mise run render:docs

          if git diff --quiet -- docs/cli &&
            test -z "$(git status --porcelain --untracked-files=all -- docs/cli)"; then
            echo "Generated documentation is already current"
            exit 0
          fi

          git add docs/cli
          # release-plz preserves maintainer commits by closing and recreating
          # its PR instead of force-pushing over them. Mark this generated
          # commit as automation so the next run can update the existing PR.
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: update generated CLI reference"
          git push origin "HEAD:$branch"
