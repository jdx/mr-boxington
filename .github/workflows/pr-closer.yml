name: pr-closer

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: pr-closer
  cancel-in-progress: false

jobs:
  pr-closer:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    timeout-minutes: 10
    steps:
      - uses: jdx/pr-closer@312c76903a271a54fb3a2b91fa507cd8bef28f78 # v1.2.1
