name: Feature request
description: Something mbx should do that it does not
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        [Current limits](https://mr-boxington.jdx.dev/limits) lists what mbx
        deliberately does not cache yet, and the
        [v1 plan](https://github.com/jdx/mr-boxington/blob/main/PLAN.md)
        lists what is already planned. A request that names one of those is
        still useful — it says the limit is worth lifting.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where mbx gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What mbx should do
      description: |
        The behavior you want. If it changes what enters an action key, what a
        build produces, or what is stored on disk, say so — correctness comes
        before hit rate, so those are the expensive parts to get right.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you tried, including other build caches.
