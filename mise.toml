[env]
_.path = ["test/bats/bin"]

[tasks.bootstrap]
hide = true
run = [
  "cargo build --package mbx --target-dir target/mbx-bootstrap-build",
  "mkdir -p target/mbx-bootstrap",
  "cp target/mbx-bootstrap-build/debug/mbx target/mbx-bootstrap/mbx",
]
run_windows = [
  "cargo build --package mbx --target-dir target/mbx-bootstrap-build",
  "New-Item -ItemType Directory -Force target/mbx-bootstrap | Out-Null",
  "Copy-Item -Force target/mbx-bootstrap-build/debug/mbx.exe target/mbx-bootstrap/mbx.exe",
]

[tasks.build]
alias = "b"
depends = ["bootstrap"]
run = "./target/mbx-bootstrap/mbx build --workspace --all-targets"
run_windows = "./target/mbx-bootstrap/mbx.exe build --workspace --all-targets"

[tasks.test]
alias = "t"
description = "Run Rust and behavioral tests"
depends = ["test:cargo", "test:e2e"]

[tasks."test:cargo"]
description = "Run Rust tests"
depends = ["bootstrap"]
run = "./target/mbx-bootstrap/mbx test --workspace"
run_windows = "./target/mbx-bootstrap/mbx.exe test --workspace"

[tasks."test:e2e"]
description = "Run platform behavioral tests"
depends = ["build"]
run = "MBX_BIN=$PWD/target/mbx-bootstrap/mbx bats test"
run_windows = "pwsh e2e-win/run.ps1"

[tasks."test:bats"]
description = "Run behavioral tests"
depends = ["build"]
run = "MBX_BIN=$PWD/target/mbx-bootstrap/mbx bats test"

[tasks.format]
depends = ["bootstrap"]
run = "./target/mbx-bootstrap/mbx fmt --all"
run_windows = "./target/mbx-bootstrap/mbx.exe fmt --all"

[tasks.lint]
depends = ["bootstrap"]
run = [
  "./target/mbx-bootstrap/mbx fmt --all --check",
  "./target/mbx-bootstrap/mbx clippy --workspace --all-features --all-targets -- -D warnings",
]
run_windows = [
  "./target/mbx-bootstrap/mbx.exe fmt --all --check",
  "./target/mbx-bootstrap/mbx.exe clippy --workspace --all-features --all-targets -- -D warnings",
]

[tasks.lint-fix]
depends = ["bootstrap"]
run = [
  "./target/mbx-bootstrap/mbx fmt --all",
  "./target/mbx-bootstrap/mbx clippy --workspace --all-features --all-targets --fix --allow-dirty --allow-staged -- -D warnings",
]
run_windows = [
  "./target/mbx-bootstrap/mbx.exe fmt --all",
  "./target/mbx-bootstrap/mbx.exe clippy --workspace --all-features --all-targets --fix --allow-dirty --allow-staged -- -D warnings",
]

[tasks.ci]
depends = ["lint", "build", "check:docs", "build:docs", "test"]

[tasks.docs]
description = "Start the documentation development server"
depends = ["render:docs"]
dir = "docs"
run = "aube install && exec aube run docs:dev"

[tasks."build:docs"]
description = "Build the documentation website"
depends = ["render:docs"]
dir = "docs"
run = "aube install && exec aube run docs:build"

[tasks."render:docs"]
description = "Generate reference documentation from the usage spec"
depends = ["bootstrap"]
# The configuration reference is not its own page: /configuration embeds it
# with an @include, so its headings are demoted to sit under that page's
# "Settings" section and the generated index links there instead.
run = [
  "rm -rf docs/cli && ./target/mbx-bootstrap/mbx __usage_spec__ | usage generate markdown --file - --multi --replace-pre-with-code-fences --url-prefix /cli --out-dir docs/cli",
  "sed -i.bak -e 's/^## /### /' docs/cli/configuration.md && rm docs/cli/configuration.md.bak",
  "sed -i.bak -e 's|(/cli/configuration.md)|(/configuration#settings)|' docs/cli/index.md && rm docs/cli/index.md.bak",
]
run_windows = [
  "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue docs/cli; ./target/mbx-bootstrap/mbx.exe __usage_spec__ | usage generate markdown --file - --multi --replace-pre-with-code-fences --url-prefix /cli --out-dir docs/cli",
  "[IO.File]::WriteAllText('docs/cli/configuration.md', ([IO.File]::ReadAllText('docs/cli/configuration.md') -replace '(?m)^## ', '### '))",
  "[IO.File]::WriteAllText('docs/cli/index.md', ([IO.File]::ReadAllText('docs/cli/index.md') -replace [regex]::Escape('(/cli/configuration.md)'), '(/configuration#settings)'))",
]

[tasks."check:docs"]
description = "Check that generated documentation is current"
depends = ["render:docs"]
run = "git diff --exit-code -- docs/cli && test -z \"$(git status --porcelain --untracked-files=all -- docs/cli)\""
run_windows = "git diff --exit-code -- docs/cli; if (git status --porcelain --untracked-files=all -- docs/cli) { exit 1 }"

[tasks."perf:prepare"]
description = "Build the fixed benchmark subject"
run = "cargo build --release --locked -p mbx"

[tasks.perf]
description = "Measure instruction-counted performance benchmarks"
depends = ["perf:prepare"]
run = "tak run"

[tasks."perf:record"]
description = "Record performance benchmarks in local git notes"
depends = ["perf:prepare"]
run = "tak run --record"

[tools]
"github:jdx/tak" = "0.0.7"
aube = "latest"
node = "24"
rust = "1.97.1"
usage = "6.3.0"
