min_version = "2026.9.7"

[env]
_.path = ["test/bats/bin"]

# The previous bootstrap binary may still be running, for example the
# `gc --automatic` it starts after a build, and Linux refuses to write over it
# ("Text file busy"). Copy to a file of this run's own and rename it into
# place. scripts/install-bootstrap.ps1 does the Windows equivalent.
[tasks.bootstrap]
hide = true
run = [
  "cargo build --package mbx --target-dir target/mbx-bootstrap-build",
  "mkdir -p target/mbx-bootstrap",
  "staged=$(mktemp target/mbx-bootstrap/.mbx.XXXXXX) && { cp -p target/mbx-bootstrap-build/debug/mbx \"$staged\" && mv -f \"$staged\" target/mbx-bootstrap/mbx || { rm -f \"$staged\"; false; }; }",
]
run_windows = [
  "cargo build --package mbx --target-dir target/mbx-bootstrap-build",
  "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install-bootstrap.ps1",
]

[tasks.build]
alias = "b"
depends = ["bootstrap"]
run = "./target/mbx-bootstrap/mbx build --workspace --all-targets"
run_windows = 'target\mbx-bootstrap\mbx.exe build --workspace --all-targets'

[tasks.test]
alias = "t"
description = "Run Rust and behavioral tests"
depends = ["test:cargo", "test:e2e", "test:release-diagnostics", "test:pretty"]

[tasks."test:cargo"]
description = "Run Rust tests"
# After `build`, not beside it. Both write `target/debug/mbx`, and the
# integration tests execute that path: a rebuild landing while a test spawns it
# fails the test with "No such file or directory", or fails the build with
# "Text file busy". A warm cache hid this by finishing `build` before the tests
# got that far.
depends = ["build"]
run = "./target/mbx-bootstrap/mbx test --workspace"
run_windows = 'target\mbx-bootstrap\mbx.exe test --workspace'

[tasks."test:release-diagnostics"]
description = "Check publication diagnostics in the release-built wrapper"
run = "cargo test --release -p mbx --test build cc_publication_failures_are_visible_without_counting_a_second_outcome"

[tasks."test:pretty"]
description = "Check Cargo's interactive display and terminal handoff"
depends = ["bootstrap"]
run = "MBX_BIN=$PWD/target/mbx-bootstrap/mbx python3 scripts/test-cargo-pretty.py"
run_windows = "pwsh -NoProfile -Command \"Write-Output 'PTY integration coverage runs on Unix; renderer tests run on every platform'\""

[tasks."test:e2e"]
description = "Run platform behavioral tests"
depends = ["build"]
run = "MBX_BIN=$PWD/target/mbx-bootstrap/mbx bats test"
run_windows = "pwsh -NoProfile e2e-win/run.ps1"

[tasks."test:bats"]
description = "Run behavioral tests"
depends = ["build"]
run = "MBX_BIN=$PWD/target/mbx-bootstrap/mbx bats test"

[tasks.format]
depends = ["bootstrap"]
run = "./target/mbx-bootstrap/mbx fmt --all"
run_windows = 'target\mbx-bootstrap\mbx.exe fmt --all'

[tasks.lint]
depends = ["bootstrap"]
run = [
  "./target/mbx-bootstrap/mbx fmt --all --check",
  "./target/mbx-bootstrap/mbx clippy --workspace --all-features --all-targets -- -D warnings",
  "./target/mbx-bootstrap/mbx clippy --release --workspace --all-features --all-targets -- -D warnings",
]
run_windows = [
  'target\mbx-bootstrap\mbx.exe fmt --all --check',
  'target\mbx-bootstrap\mbx.exe clippy --workspace --all-features --all-targets -- -D warnings',
  'target\mbx-bootstrap\mbx.exe clippy --release --workspace --all-features --all-targets -- -D warnings',
]

[tasks.lint-fix]
depends = ["bootstrap"]
run = [
  "./target/mbx-bootstrap/mbx fmt --all",
  "./target/mbx-bootstrap/mbx clippy --workspace --all-features --all-targets --fix --allow-dirty --allow-staged -- -D warnings",
]
run_windows = [
  'target\mbx-bootstrap\mbx.exe fmt --all',
  'target\mbx-bootstrap\mbx.exe clippy --workspace --all-features --all-targets --fix --allow-dirty --allow-staged -- -D warnings',
]

[tasks.ci]
depends = ["lint", "build", "check:docs", "check:links", "test"]

[tasks.docs]
description = "Start the documentation development server"
depends = ["render:docs"]
dir = "docs"
run = "aube install && exec aube run docs:dev"

[tasks."build:docs"]
description = "Build the documentation website"
depends = ["render:docs"]
dir = "docs"
run = "aube install && exec aube run docs:build"

# The landing page plays this video and offers it as og:video for link
# previews. It needs ffmpeg and Playwright's Chromium headless shell; builds
# without it leave the showreel out.
[tasks."render:showreel"]
description = "Render the landing-page showreel to docs/public/showreel-120.mp4 and showreel.mp4 with its poster"
dir = "docs"
run = "aube install && exec aube run showreel:video"

[tasks."check:docs"]
description = "Check that generated documentation is current"
depends = ["render:docs"]
run = "git diff --exit-code -- docs/cli && test -z \"$(git status --porcelain --untracked-files=all -- docs/cli)\""
run_windows = "pwsh -NoProfile -Command \"git diff --exit-code -- docs/cli; if (git status --porcelain --untracked-files=all -- docs/cli) { exit 1 }\""

# VitePress validates page links at build time but not #fragments, so a
# renamed heading rots its inbound anchors silently. --offline keeps external
# URLs out of it: this checks the site against itself, not the internet.
[tasks."check:links"]
description = "Check internal links and anchors in the built documentation"
depends = ["build:docs"]
run = "lychee --offline --include-fragments --root-dir \"$PWD/docs/.vitepress/dist\" --fallback-extensions html 'docs/.vitepress/dist/**/*.html'"

[tasks."perf:prepare"]
description = "Build the fixed benchmark subject"
run = "mbx build --release --locked -p mbx"

[tasks."build:pgo"]
description = "Build a profile-guided mbx release binary"
run = "benchmarks/pgo.bash"

[tasks.perf]
description = "Measure instruction-counted performance benchmarks"
depends = ["perf:prepare"]
run = "tak run"

[tasks."perf:record"]
description = "Record performance benchmarks in local git notes"
depends = ["perf:prepare"]
run = "tak run --record"

[tools]
# Perf jobs build the current source with the latest released mbx so the
# appliance cache is usable without bootstrapping from the branch under test.
mr-boxington = { version = "latest", minimum_release_age = "0s" }
tak = { version = "latest", minimum_release_age = "0s" }
aube = { version = "latest", lazy = true, lazy_bins = ["aube"], minimum_release_age = "0s" }
hk = { version = "latest", minimum_release_age = "0s" }
communique = { version = "latest", minimum_release_age = "0s" }
jactionlint = "latest"
lychee = "0.24.2"
node = "24"
python = "3"
# Native scheduler integration tests exercise cargo-nextest's test runner.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
# Rust is deliberately absent: the toolchain floats to whatever the
# runner image ships, so a new stable is caught by CI rather than by a
# user. The benchmark workflows pin their own, because a measurement is
# only comparable against the compiler that produced the baseline.
usage = { version = "latest", minimum_release_age = "0s" }
