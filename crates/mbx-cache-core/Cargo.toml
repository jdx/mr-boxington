[package]
name = "mbx-cache-core"
version.workspace = true
description = "Action cache protocol, CAS, authentication, and transport primitives for mbx"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23"
blake3 = "1"
eyre = "0.6"
fslock = "0.2"
futures-util = "0.3"
hex = "0.4"
log = "0.4"
rand = "0.10"
reflink-copy = "0.1"
async-compression = { version = "0.4", default-features = false, features = [
  "tokio",
  "zstd",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "zstd",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
mockito = "1"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[features]
default = ["rustls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
rustls-native-roots = ["reqwest/rustls"]
