[package]
name = "mbx-cache-core"
version = "0.9.2"
description = "Unstable CAS, transport, and cache-agent primitives for mbx embedders"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["cache", "build-cache", "cas", "content-addressed", "rustc"]
categories = ["development-tools::build-utils", "caching", "network-programming"]
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64 = "0.23"
bytes = "1"
blake3 = "1"
eyre = "0.6"
fslock = "0.2"
futures-util = "0.3"
hex = "0.4"
log = "0.4"
mbx-cache-protocol = { path = "../mbx-cache-protocol", version = "0.5.5" }
rand = "0.10"
reflink-copy = "0.1"
async-compression = { version = "0.4", default-features = false, features = [
  "tokio",
  "zstd",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "zstd",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
mockito = "1"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[features]
default = ["rustls"]
fuzzing = []
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
rustls-native-roots = ["reqwest/rustls"]
