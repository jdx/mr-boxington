[package]
name = "mbx-cache-rustc"
version.workspace = true
description = "Conservative rustc action analysis and key construction for mbx"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
mbx-cache-core = { path = "../mbx-cache-core", version = "0.4.0", default-features = false }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["rustls"]
native-tls = ["mbx-cache-core/native-tls"]
rustls = ["mbx-cache-core/rustls"]
rustls-native-roots = ["mbx-cache-core/rustls-native-roots"]
