[package]
name = "mbx-cache-cc"
version = "0.8.0"
description = "mbx internals: conservative C and C++ action analysis and key construction. No API stability -- use the mbx CLI or mbx-cache-protocol."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["cache", "build-cache", "cc", "cargo"]
categories = ["development-tools::build-utils", "caching"]
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
mbx-cache-core = { path = "../mbx-cache-core", version = "0.8.0", default-features = false }
mbx-cache-rustc = { path = "../mbx-cache-rustc", version = "0.8.0", default-features = false }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = ["rustls"]
native-tls = ["mbx-cache-core/native-tls", "mbx-cache-rustc/native-tls"]
rustls = ["mbx-cache-core/rustls", "mbx-cache-rustc/rustls"]
rustls-native-roots = [
  "mbx-cache-core/rustls-native-roots",
  "mbx-cache-rustc/rustls-native-roots",
]
