<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 28 256 256" role="img" aria-labelledby="title description">
  <title id="title">mr boxington</title>
  <desc id="description">A dapper cardboard cache box with a monocle, mustache, and bow tie</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d693"/>
      <stop offset="1" stop-color="#e8b95f"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2ab51"/>
      <stop offset="1" stop-color="#c4862c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd7f26"/>
      <stop offset="1" stop-color="#955c19"/>
    </linearGradient>
  </defs>

  <!-- box panels -->
  <path d="M160 40 264 92 160 144 56 92Z" fill="url(#top)" stroke="#53350f" stroke-linejoin="round" stroke-width="8"/>
  <path d="M56 92 160 144V272L56 220Z" fill="url(#left)" stroke="#53350f" stroke-linejoin="round" stroke-width="8"/>
  <path d="M264 92 160 144V272L264 220Z" fill="url(#right)" stroke="#53350f" stroke-linejoin="round" stroke-width="8"/>

  <!-- packing tape across the top seam, wrapping down the right panel -->
  <path d="M120 60 224 112 200 124 96 72Z" fill="#efd8a4" stroke="#a5772b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M224 112v26l-24 12v-26z" fill="#d8b96e" stroke="#a5772b" stroke-width="4" stroke-linejoin="round"/>

  <!-- shipping label on the right panel -->
  <g transform="translate(160,144) matrix(1 -.5 0 1 0 0)">
    <rect x="28" y="40" width="50" height="32" rx="3" fill="#f6ecd2" stroke="#8a5215" stroke-width="4"/>
    <path d="M35 50h26M35 58h32M35 66h20" fill="none" stroke="#b08d4d" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- face on the left panel: full iso shear so everything lies on the plane -->
  <g transform="translate(108,182) matrix(1 .5 0 1 0 0)">
    <!-- eyebrows -->
    <path d="M-38 -52q11 -7 21 -2" fill="none" stroke="#2a3f44" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M6 -52q11 -7 21 -2" fill="none" stroke="#2a3f44" stroke-width="5.5" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="-26" cy="-28" r="8" fill="#2a3f44"/>
    <circle cx="-28.5" cy="-30.5" r="2.6" fill="#f6ecd2"/>
    <circle cx="18" cy="-28" r="8" fill="#2a3f44"/>
    <circle cx="15.5" cy="-30.5" r="2.6" fill="#f6ecd2"/>
    <!-- monocle: rigid ring pressed against the panel, so it shears with the plane -->
    <circle cx="18" cy="-28" r="16.5" fill="none" stroke="#2a3f44" stroke-width="5"/>
    <path d="M7.1 -33.1A12 12 0 0 1 12 -38.4" fill="none" stroke="#f6ecd2" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <path d="M33 -16.5Q35.5 -9 34 -3" fill="none" stroke="#2a3f44" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="33.8" cy="-.5" r="3" fill="#2a3f44"/>
    <!-- handlebar mustache -->
    <g fill="#2a3f44">
      <path d="M-4 2 C0 -4 8 -6 14 -3 C20 -.5 23 -2.5 24.5 -7 C28 -2 27 5 21 7.5 C13 11 1 11 -4 8 Z"/>
      <path d="M-4 2 C-8 -4 -16 -6 -22 -3 C-28 -.5 -31 -2.5 -32.5 -7 C-36 -2 -35 5 -29 7.5 C-21 11 -9 11 -4 8 Z"/>
    </g>
    <!-- bow tie -->
    <path d="M-12 34 -34 22.5c-3.6-1.9-8 .7-8 4.8v13.4c0 4.1 4.4 6.7 8 4.8L-12 34Z" fill="#35555c" stroke="#2a3f44" stroke-width="4" stroke-linejoin="round"/>
    <path d="M4 34 26 22.5c3.6-1.9 8 .7 8 4.8v13.4c0 4.1-4.4 6.7-8 4.8L4 34Z" fill="#35555c" stroke="#2a3f44" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-11" y="26" width="14" height="16" rx="3.5" fill="#e9b650" stroke="#2a3f44" stroke-width="4"/>
  </g>
</svg>
